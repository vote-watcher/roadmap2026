<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Watcher</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#c9ced6; --accent:#1a56db; --text:#1f2937; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:680px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; text-align:center; margin:8px 0 4px; }
  p.sub { text-align:center; color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; display:block; text-decoration:none; color:inherit; }
  .card:hover { border-color:var(--accent); }
  .card .t { font-weight:700; font-size:16px; }
  .card .d { color:var(--muted); font-size:14px; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vote Watcher</h1>
  <p class="sub">Инструменты наблюдателя на выборах</p>

  <a class="card" href="uvedomlenie_form.html">
    <div class="t">Уведомление о съёмке наблюдателя</div>
    <div class="d">Заполнить форму и скачать PDF (работает на телефоне и ПК)</div>
  </a>

  <a class="card" href="vote_roadmap_2026.html">
    <div class="t">Дорожная карта 2026</div>
    <div class="d">Полный документ</div>
  </a>

  <a class="card" href="vote_roadmap_2026_cards.html">
    <div class="t">Дорожная карта 2026 — карточки</div>
    <div class="d">Версия в виде карточек</div>
  </a>

  <a class="card" href="vote_roadmap_2026_picker.html">
    <div class="t">Дорожная карта 2026 — конструктор</div>
    <div class="d">Интерактивный выбор разделов</div>
  </a>
</div>
</body>
</html>
